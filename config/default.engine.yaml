schema_version: 2

creation:
  mode: "original"

fanfiction:
  continuity_mode: "canon_compliant"
  sources: []

project:
  slug: "untitled_longform"
  title: "未命名长篇小说"
  root_dir: "novels/untitled_longform"

novel:
  target_platform: "qidian"
  audience: "中文长篇网文读者"
  core_promise: "以稳定主线、阶段爽点和持续伏笔回收支撑长篇连载。"
  main_question: "主角如何在既有秩序中完成成长并改变自身命运？"
  ending_direction: "主线矛盾完成收束，主角付出明确代价并兑现读者承诺。"
  style: ""
  forbidden_experience:
    - "连续多章无推进"
    - "主角无理由降智"
    - "事实、战力或时间线无依据漂移"

length:
  metric: "content_characters_v1"
  target_total_characters: 2000000
  completion_tolerance: [0.90, 1.10]
  chapter:
    target_characters: 3000
    soft_min: 2400
    soft_max: 3600
    hard_min: 2000
    hard_max: 4200
  volume:
    target_characters: 250000
  planning:
    mode: "rolling"
    detailed_horizon: 20
    refill_threshold: 8

story_profile:
  market:
    primary: "qidian_male"
    compatibility: ["fanqie_free"]
  setting:
    primary: "xuanhuan"
    secondary: []
  plot_engines:
    primary: "progression"
    supporting: []
  narrative_forms: ["single_lead"]
  premise_devices: []
  relationship_modes: ["team"]
  tone: ["adventure"]
  resolutions: []

writing:
  mode: "agent_skill"
  agent:
    task_dir: "50_workbench/writing_tasks"
    draft_dir: "50_workbench/agent_drafts"
    default_agent: "codex"
    default_workflow: "command_driven"
    context:
      mode: "adaptive"
      host_profile: "standard"
      capacity_override_units: null
      overflow_policy: "split_context"
quality:
  profile:
    phase: "auto"
    strictness: "balanced"
    overrides: {}
  semantic_review_milestones: [1, 3, 10, 30]
  semantic_review_boundaries: true
  reader_payoff:
    review_mode: "risk_based"
  repair:
    selected_p2_codes: []
  humanizer:
    changed_character_warning_ratio: 0.35
    changed_character_human_ratio: 0.60
    semantic_review_mode: "risk_based"
    semantic_review_change_ratio: 0.15
  semantic_pacing:
    review_mode: "off"

editorial:
  review_mode: "risk_based"
  review_roles: []
  conditional_pass_limit: 3

rag:
  candidate_pool_size: 40
  top_k: 12
  chunk_max_chars: 900
  chunk_overlap_chars: 120
  semantic_weight: 0.55
  keyword_weight: 0.25
  metadata_weight: 0.20

semantic:
  enabled: true
  profile: "bge-m3"
  models_dir: ""
  allow_network_download: true
  require_real_model: true
  allow_fallback: false
  vector_store:
    backend: "local_hnsw"
    url: ""
    index_url: ""
    metric: "cosine"
    dim: 1024
    hnsw_threshold: 10000
    hnsw_m: 16
    hnsw_ef_construction: 200
    hnsw_ef_search: 80
    hnsw_candidate_multiplier: 8

gates:
  forbidden_reveals: []
  mainline_reveal_warning_hits: 8
  p0_meta_pollution_patterns:
    - "TODO"
    - "写作说明"
    - "作者按"
    - "角色定位"
    - "[说明]"

pacing:
  default_mode: "balanced"
  fast_chapter_cooldown: 1
  max_major_quota_triggers_per_chapter: 1
  volume_distribution: [80, 80, 85, 85, 85, 85]
  event_types:
    - conflict_thrill
    - bond_deepening
    - faction_building
    - world_painting
    - tension_escalation
  event_cooldown:
    conflict_thrill: 1
    bond_deepening: 1
    faction_building: 1
    world_painting: 1
    tension_escalation: 1
  soft_event_window_chapters: 5
  max_consecutive_fast_chapters: 2
  fast_chapter_quota_per_volume: 45

research:
  web_search_enabled: true
  inbox_dir: "50_workbench/research_inbox"
  impact_report_dir: "50_workbench/impact_reports"
  canon_file: "10_bible/research_canon.jsonl"
  impact_ledger: "20_outline/research_impact_ledger.jsonl"
  search_provider: "zh.wikipedia"
  search_limit: 5
  network_timeout_seconds: 8
