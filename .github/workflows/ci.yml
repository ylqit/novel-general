name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e .
      - run: python scripts/sync_skill_references.py --check
      - run: python scripts/build_resource_manifest.py --check
      - run: python scripts/validate_skills.py
      - run: python scripts/release_surface_guards.py
      - run: python -m pytest
      - run: python -m build --wheel --sdist
      - run: python scripts/audit_wheel.py
      - run: python scripts/audit_sdist.py
      - run: python -c "import pathlib,subprocess,sys; wheels=list(pathlib.Path('dist').glob('*.whl')); assert len(wheels)==1; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheels[0])])"
      - run: longform-engine --version
      - run: longform-engine validate-config --template qidian-longform
      - run: longform-engine release check --repository . --skip-contracts --allow-detached --json

  semantic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[semantic]"
      - run: python -c "import huggingface_hub, sentence_transformers; print('semantic dependencies ready')"
      - run: |
          export LONGFORM_CODEX_SKILL_ROOT="$RUNNER_TEMP/codex-skills"
          export LONGFORM_CLAUDE_SKILL_ROOT="$RUNNER_TEMP/claude-skills"
          longform-engine skills install --tool all
          longform-engine doctor --tool all --json

  macos-pipx-smoke:
    runs-on: macos-latest
    env:
      PIPX_HOME: ${{ runner.temp }}/pipx-home
      PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
      LONGFORM_CODEX_SKILL_ROOT: ${{ runner.temp }}/codex-skills
      LONGFORM_CLAUDE_SKILL_ROOT: ${{ runner.temp }}/claude-skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build pipx
      - run: python -m build --wheel
      - run: python scripts/audit_wheel.py
      - run: echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
      - run: python -m pipx install --force dist/*.whl
      - run: python -m pipx inject longform-novel-engine huggingface-hub sentence-transformers
      - run: longform-engine --version
      - run: longform-engine validate-config --template qidian-longform
      - run: longform-engine skills install --tool all
      - run: longform-engine skills status --tool all --json
      - run: longform-engine doctor --tool all --json
      - run: longform-engine skills uninstall --tool all --yes
