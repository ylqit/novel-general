name: Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing version tag to rebuild and publish.
        required: true
        default: v0.14.0
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel --sdist
      - run: python scripts/build_release_checksums.py --write
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_ref || github.ref_name }}
          body_path: docs/releases/${{ inputs.release_ref || github.ref_name }}.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
