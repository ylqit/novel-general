name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing version tag to rebuild and publish.
        required: true
        default: v0.3.0
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build pytest hnswlib numpy
      - run: python -m pip install -e .
      - run: python scripts/sync_skill_references.py --check
      - run: python scripts/build_resource_manifest.py --check
      - run: python scripts/validate_skills.py
      - run: python scripts/release_surface_guards.py
      - run: python -m pytest
      - run: python -m build --wheel --sdist
      - run: python scripts/audit_wheel.py
      - run: python scripts/audit_sdist.py
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: longform-engine release check --repository . --tag "$RELEASE_TAG" --check-remote --skip-contracts --json
        env:
          RELEASE_TAG: ${{ inputs.release_ref || github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_ref || github.ref_name }}
          body_path: docs/releases/v0.3.0.md
          files: |
            dist/*.whl
            dist/*.tar.gz
