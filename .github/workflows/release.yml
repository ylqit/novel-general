name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python scripts/sync_skill_references.py --check
      - run: python scripts/build_resource_manifest.py --check
      - run: python scripts/validate_skills.py
      - run: python scripts/release_surface_guards.py
      - run: python -m pytest
      - run: python -m build --wheel --sdist
      - run: python scripts/audit_wheel.py
      - run: python scripts/audit_sdist.py
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: longform-engine release check --repository . --tag "$GITHUB_REF_NAME" --check-remote --skip-contracts --json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
