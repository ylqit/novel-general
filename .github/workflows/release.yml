name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing version tag to rebuild and publish.
        required: true
        default: v0.7.0
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip hnswlib numpy
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy --follow-imports=skip src/longform_engine/vector_backends.py src/longform_engine/chapter_contract.py src/longform_engine/storage/recovery.py src/longform_engine/human_author_revision.py src/longform_engine/human_story_review.py src/longform_engine/author_voice.py src/longform_engine/publication.py
      - run: python scripts/sync_skill_references.py --check
      - run: python scripts/build_resource_manifest.py --check
      - run: python scripts/validate_skills.py
      - run: python scripts/check_markdown_links.py
      - run: python scripts/release_surface_guards.py
      - run: python -m pytest --cov=longform_engine --cov-report=term-missing
      - run: python -m build --wheel --sdist
      - run: python scripts/audit_wheel.py
      - run: python scripts/audit_sdist.py
      - run: python scripts/build_release_checksums.py --write
      - run: python scripts/build_release_checksums.py --check
      - shell: pwsh
        run: python -m pip install --force-reinstall (Get-ChildItem dist/*.whl).FullName
      - shell: pwsh
        run: longform-engine release check --repository . --tag "$env:RELEASE_TAG" --check-remote --skip-contracts --json
        env:
          RELEASE_TAG: ${{ inputs.release_ref || github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_ref || github.ref_name }}
          body_path: docs/releases/${{ inputs.release_ref || github.ref_name }}.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
