schema_version: 2

creation:
  mode: "original"

fanfiction:
  continuity_mode: "canon_compliant"
  sources: []

project:
  slug: "longform_200w_demo"
  title: "二百万字长篇示例项目"
  root_dir: "novels/longform_200w_demo"
  language: "zh-CN"
  timezone: "Asia/Hong_Kong"

novel:
  target_platform: "qidian"
  audience: "中文长篇小说读者"
  core_promise: "底层主角凭借独特体系逐步撬动旧秩序，并在每卷兑现阶段爽点。"
  main_question: "主角如何在旧秩序压迫下完成成长、扩张势力并改写世界规则？"
  ending_direction: "主角完成终局选择，核心秘密回收，旧秩序被重塑但代价明确。"
  forbidden_experience:
    - "连续多章无推进"
    - "主角无理由降智"
    - "战力体系无成本膨胀"
    - "伏笔长期开坑不回收"

length:
  metric: "content_characters_v1"
  target_total_characters: 2000000
  completion_tolerance: [0.90, 1.10]
  chapter:
    target_characters: 3000
    soft_min: 2400
    soft_max: 3600
    hard_min: 2000
    hard_max: 4200
  volume:
    target_characters: 250000
  planning:
    mode: "rolling"
    detailed_horizon: 20
    refill_threshold: 8

story_profile:
  market:
    primary: "qidian_male"
    compatibility: ["fanqie_free"]
  setting:
    primary: "xuanhuan"
    secondary: []
  plot_engines:
    primary: "progression"
    supporting: ["mystery"]
  narrative_forms: ["single_lead"]
  premise_devices: []
  relationship_modes: ["team"]
  tone: ["adventure", "suspense"]
  resolutions: []

writing:
  mode: "agent_skill"
  agent:
    task_dir: "50_workbench/writing_tasks"
    draft_dir: "50_workbench/agent_drafts"
    require_submit_command: true
    default_agent: "codex"
    context:
      mode: "adaptive"
      host_profile: "standard"
      capacity_override_units: null
      overflow_policy: "split_context"
  template_dry_run:
    enabled: false

quality:
  assurance_mode: "balanced"
  profile:
    phase: "auto"
    strictness: "balanced"
    overrides: {}
  approved_style_baseline:
    chapters: []
    update_requires_human: true
  creative_guidance:
    mode: "guided"
  semantic_review_milestones: [1, 3, 10, 30]
  semantic_review_boundaries: true
  reader_payoff:
    review_mode: "risk_based"
    structure_window: 20
    language_similarity_threshold: 0.72
  humanizer:
    changed_character_warning_ratio: 0.35
    changed_character_human_ratio: 0.60
    semantic_review_mode: "risk_based"
    semantic_review_change_ratio: 0.15

rag:
  enabled: true
  backend: "sqlite_hybrid"
  candidate_pool_size: 40
  top_k: 12
  semantic_weight: 0.55
  keyword_weight: 0.25
  metadata_weight: 0.20
  embedding:
    enabled: true
    profile: "bge-m3"
    model: "BAAI/bge-m3"
    cache_dir: "70_runtime/models"
  reranker:
    enabled: true
    profile: "bge-m3"
    model: "BAAI/bge-reranker-v2-m3"
    candidate_limit: 24

semantic:
  enabled: true
  profile: "bge-m3"
  fallback_profile: "local-hash"
  models_dir: ""
  allow_network_download: true
  require_real_model: true
  allow_fallback: false
  vector_store:
    backend: "local_hnsw"
    url: ""
    index_url: ""
    collection: "longform_vectors"
    api_key_env: "LONGFORM_VECTOR_API_KEY"
    metric: "cosine"
    dim: 1024
    hnsw_threshold: 10000
    hnsw_m: 16
    hnsw_ef_construction: 200
    hnsw_ef_search: 80
    hnsw_candidate_multiplier: 8

pacing:
  volume_distribution: [80, 80, 85, 85, 85, 85]
  event_quota_window_chapters: 5
  fast_chapter_cooldown: 1
  max_major_quota_triggers_per_chapter: 1
  event_types:
    - conflict_thrill
    - bond_deepening
    - faction_building
    - world_painting
    - tension_escalation
  event_cooldown:
    conflict_thrill: 1
    bond_deepening: 1
    faction_building: 1
    world_painting: 1
    tension_escalation: 1
  soft_event_window_chapters: 5
  max_consecutive_fast_chapters: 2
  fast_chapter_quota_per_volume: 45

research:
  web_search_enabled: true
  default_ingestion: "reviewed_inbox"
  search_provider: "zh_wikipedia"
  search_limit: 5
  promote_requires_approval: true

revision:
  default_strategy: "transaction_branch"
  keep_detached_drafts: true

codex:
  default_workflow: "command_driven"
  pause_on_gate_failure: true
