[project]
name = "longform-novel-engine"
version = "0.4.0.dev0"
description = "Engineering-first AI engine for million-word Chinese longform novels."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "ylqit" },
]
keywords = ["novel", "writing", "codex", "claude-code", "agent-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
semantic = [
  "huggingface_hub>=0.24",
  "hnswlib>=0.8.0",
  "sentence-transformers>=3.0",
]

[project.scripts]
longform-engine = "longform_engine.cli:main"

[project.urls]
Homepage = "https://github.com/ylqit/novel-general"
Repository = "https://github.com/ylqit/novel-general.git"
Issues = "https://github.com/ylqit/novel-general/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longform_engine"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "longform_engine/resources/config"
"templates" = "longform_engine/resources/templates"
"longform-novel-codex" = "longform_engine/resources/longform-novel-codex"
"longform-novel-claude" = "longform_engine/resources/longform-novel-claude"
"shared" = "longform_engine/resources/shared"
"resource-manifest.json" = "longform_engine/resources/resource-manifest.json"
"pyproject.toml" = "longform_engine/resources/pyproject.toml"

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/AGENTS.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/config",
  "/docs",
  "/templates",
  "/longform-novel-codex",
  "/longform-novel-claude",
  "/shared",
  "/resource-manifest.json",
  "/scripts",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
