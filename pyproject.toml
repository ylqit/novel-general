[project]
name = "longform-novel-engine"
version = "0.4.4"
description = "Engineering-first AI engine for million-word Chinese longform novels."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "ylqit" },
]
keywords = ["novel", "writing", "codex", "claude-code", "agent-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
semantic = [
  "huggingface_hub>=0.24",
  "hnswlib>=0.8.0",
  "sentence-transformers>=3.0",
]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
longform-engine = "longform_engine.cli:main"

[project.urls]
Homepage = "https://github.com/ylqit/novel-general"
Repository = "https://github.com/ylqit/novel-general.git"
Issues = "https://github.com/ylqit/novel-general/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longform_engine"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "longform_engine/resources/config"
"templates" = "longform_engine/resources/templates"
"longform-novel-codex" = "longform_engine/resources/longform-novel-codex"
"longform-novel-claude" = "longform_engine/resources/longform-novel-claude"
"shared" = "longform_engine/resources/shared"
"resource-manifest.json" = "longform_engine/resources/resource-manifest.json"
"pyproject.toml" = "longform_engine/resources/pyproject.toml"

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/AGENTS.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/config",
  "/docs",
  "/templates",
  "/longform-novel-codex",
  "/longform-novel-claude",
  "/shared",
  "/resource-manifest.json",
  "/scripts",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["longform_engine"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
