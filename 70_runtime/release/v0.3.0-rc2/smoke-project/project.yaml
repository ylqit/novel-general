schema_version: 1
creation:
  mode: original
fanfiction:
  continuity_mode: canon_compliant
  sources: []
project:
  slug: longform_150w_demo
  title: 百万字长篇示例项目
  root_dir: D:\soft\code\OpenGit\novel-generator\longform-novel-engine\70_runtime\release\v0.3.0-rc2\smoke-project
  language: zh-CN
  timezone: Asia/Hong_Kong
length:
  total_chapters: 500
  target_total_words: 1500000
  volume_count: 6
  chapter_word_count:
    target: 3000
    min: 2400
    max: 3600
    hard_min: 2000
    hard_max: 4200
  new_book_phase_chapters: 30
  ending_phase_chapters: 60
storage:
  layout_version: 2
  filesystem_primary: true
  runtime_database: 70_runtime/db/longform_engine.sqlite
  directories:
    governance: 00_governance
    bible: 10_bible
    outline: 20_outline
    state: 30_state
    manuscript: 40_manuscript
    workbench: 50_workbench
    rag: 60_rag
    runtime: 70_runtime
    exports: 80_exports
  atomic_writes: true
writing:
  mode: agent_skill
  agent:
    task_dir: 50_workbench/writing_tasks
    draft_dir: 50_workbench/agent_drafts
    require_submit_command: true
    default_agent: codex
  template_dry_run:
    enabled: false
quality:
  market_profile: qidian_male
  genre_profile: xuanhuan
  assurance_mode: balanced
  semantic_review_milestones:
  - 1
  - 3
  - 10
  - 30
  semantic_review_boundaries: true
  reader_payoff:
    review_mode: risk_based
    structure_window: 20
    language_similarity_threshold: 0.72
  humanizer:
    changed_character_warning_ratio: 0.35
    changed_character_human_ratio: 0.6
    semantic_review_mode: risk_based
    semantic_review_change_ratio: 0.15
  approved_style_baseline:
    chapters: []
    update_requires_human: true
  creative_guidance:
    mode: automatic
  profile:
    market: qidian_male
    genre: xuanhuan
    phase: auto
    strictness: balanced
    overrides: {}
engine:
  name: longform-novel-engine
  mode: local_filesystem_primary
novel:
  target_platform: qidian
  genre: 玄幻
  audience: 中文长篇小说读者
  core_promise: 底层主角凭借独特体系逐步撬动旧秩序，并在每卷兑现阶段爽点。
  main_question: 主角如何在旧秩序压迫下完成成长、扩张势力并改写世界规则？
  ending_direction: 主角完成终局选择，核心秘密回收，旧秩序被重塑但代价明确。
  subgenre: 东方玄幻
  forbidden_experience:
  - 连续多章无推进
  - 主角无理由降智
  - 战力体系无成本膨胀
  - 伏笔长期开坑不回收
workflow:
  require_previous_gate_passed: true
  require_beat_before_draft: true
  require_research_promote_before_canon: true
  require_snapshot_before_mutation: true
  default_pipeline:
  - load_config
  - acquire_project_lock
  - verify_previous_gate
  - create_snapshot
  - query_rag
  - load_graph_state
  - make_chapter_card
  - generate_beat_sheet
  - draft_chapter
  - run_gates
  - finalize_or_repair
  - update_memory
  - sync_indexes
  - release_project_lock
rag:
  enabled: true
  backend: sqlite_hybrid
  candidate_pool_size: 40
  top_k: 12
  small_context_top_k: 4
  semantic_weight: 0.55
  keyword_weight: 0.25
  metadata_weight: 0.2
  embedding:
    enabled: true
    profile: bge-m3
    model: BAAI/bge-m3
    cache_dir: 70_runtime/models
  reranker:
    enabled: true
    profile: bge-m3
    model: BAAI/bge-reranker-v2-m3
    candidate_limit: 24
  retrieval:
    mode: hybrid
    fusion: rrf
  write_next_plot_context: true
  query_cache: true
semantic:
  enabled: true
  profile: bge-m3
  fallback_profile: local-hash
  models_dir: 70_runtime/models
  allow_network_download: true
  require_real_model: true
  allow_fallback: false
  vector_store:
    backend: local_sqlite
    url: ''
    index_url: ''
    collection: longform_vectors
    api_key_env: LONGFORM_VECTOR_API_KEY
    metric: cosine
    dim: 1024
    hnsw_threshold: 10000
    hnsw_m: 16
    hnsw_ef_construction: 200
    hnsw_ef_search: 80
    hnsw_candidate_multiplier: 8
memory:
  backend: filesystem
  scene_dir: 60_rag/memory/scenes
  chapter_dir: 60_rag/memory/chapters
  arc_dir: 60_rag/memory/arcs
  tcs_dir: 30_state/tcs
  semantic_task_dir: 50_workbench/memory_tasks
graph:
  enabled: true
  source_file: 30_state/story_graph.json
  mirror_to_sqlite: true
  entity_types:
  - character
  - location
  - organization
  - item
  - ability
  - secret
  - foreshadowing
  - event
gates:
  block_on_previous_failure: true
  artifact_dir: 50_workbench/gate_artifacts
  required_files:
  - gate_result.json
  - consistency_report.md
  - pacing_review.md
  - style_review.md
  - repair_plan.md
  p0_meta_pollution_patterns:
  - TODO
  - 写作说明
  - 作者按
  - 角色定位
  - '[说明]'
  allowed_actions_after_failure:
  - repair_chapter
  - rollback_chapter
pacing:
  event_quota_window_chapters: 5
  fast_chapter_cooldown: 1
  max_major_quota_triggers_per_chapter: 1
  quota_types:
    A: 主线矛盾实质推进
    B: 主要关系决定性升级
    C: 核心秘密完整揭露
  volume_distribution:
  - 80
  - 80
  - 85
  - 85
  - 85
  - 85
  event_types:
  - conflict_thrill
  - bond_deepening
  - faction_building
  - world_painting
  - tension_escalation
  event_cooldown:
    conflict_thrill: 1
    bond_deepening: 1
    faction_building: 1
    world_painting: 1
    tension_escalation: 1
  soft_event_window_chapters: 5
  max_consecutive_fast_chapters: 2
  fast_chapter_quota_per_volume: 45
research:
  enabled: true
  web_search_enabled: true
  default_ingestion: reviewed_inbox
  inbox_dir: 50_workbench/research_inbox
  impact_report_dir: 50_workbench/impact_reports
  canon_file: 10_bible/research_canon.jsonl
  impact_ledger: 20_outline/research_impact_ledger.jsonl
  search_provider: zh_wikipedia
  search_limit: 5
  network_timeout_seconds: 8
  promote_requires_approval: true
revision:
  default_strategy: transaction_branch
  keep_detached_drafts: true
  mark_indexes_stale_after_rollback: true
  snapshot_before_rollback: true
codex:
  default_workflow: command_driven
  require_human_confirmation_per_chapter: false
  pause_on_gate_failure: true
